plugins {
    id 'com.android.application'
}

android {
    namespace 'org.offchat.mesh'
    compileSdk 34

    defaultConfig {
        applicationId "org.offchat.mesh"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".v1"
            versionNameSuffix "-v1"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
